<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f7f1e8">
<title>Fotos de la boda</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f1e8; --card:#fffdf9; --ink:#2f2a26; --muted:#8a8178;
    --gold:#b8955a; --gold-dark:#9a7a43; --line:#e8dfd2; --danger:#b5574b;
    --radius:18px;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
  html,body{margin:0;background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif}
  body{min-height:100dvh;padding:env(safe-area-inset-top) 0 env(safe-area-inset-bottom)}
  .wrap{max-width:720px;margin:0 auto;padding:0 18px 40px}
  .hidden{display:none!important}

  /* Portada */
  header{text-align:center;padding:48px 0 28px}
  .ornament{color:var(--gold);letter-spacing:.4em;font-size:13px}
  h1{font-family:"Cormorant Garamond",serif;font-weight:600;font-size:46px;line-height:1.05;margin:14px 0 8px}
  .sub{font-family:"Cormorant Garamond",serif;font-style:italic;font-size:21px;color:var(--muted);margin:0}

  .actions{display:grid;gap:14px;margin-top:22px}
  .btn{appearance:none;border:0;border-radius:var(--radius);padding:20px;font:600 17px Inter,sans-serif;
       display:flex;align-items:center;justify-content:center;gap:12px;cursor:pointer;width:100%;transition:transform .08s}
  .btn:active{transform:scale(.98)}
  .btn svg{width:24px;height:24px;flex:none}
  .btn-primary{background:var(--gold);color:#fff;box-shadow:0 8px 24px -10px rgba(154,122,67,.7)}
  .btn-outline{background:var(--card);color:var(--ink);border:1.5px solid var(--line)}
  .btn-danger{background:var(--card);color:var(--danger);border:1.5px solid var(--line)}
  .btn-small{padding:12px 16px;font-size:15px;width:auto;border-radius:12px}
  .btn[disabled]{opacity:.6;pointer-events:none}

  /* Vista previa */
  .preview{padding-top:24px}
  .preview img{width:100%;max-height:65dvh;object-fit:contain;border-radius:var(--radius);background:#000;display:block}
  .row{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}

  /* Galería */
  .bar{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:18px 0 14px;position:sticky;top:0;background:var(--bg);z-index:5}
  .bar h2{font-family:"Cormorant Garamond",serif;font-size:30px;margin:0}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
  @media(min-width:560px){.grid{grid-template-columns:repeat(3,1fr)}}
  .tile{position:relative;aspect-ratio:1;border-radius:14px;overflow:hidden;background:var(--line)}
  .tile img{width:100%;height:100%;object-fit:cover;display:block;cursor:pointer}
  .dl{position:absolute;right:8px;bottom:8px;width:42px;height:42px;border-radius:50%;border:0;
      background:rgba(255,253,249,.92);color:var(--ink);display:grid;place-items:center;cursor:pointer;
      box-shadow:0 2px 10px rgba(0,0,0,.2)}
  .dl svg{width:20px;height:20px}
  .del{position:absolute;right:8px;top:8px;width:38px;height:38px;border-radius:50%;border:0;
       background:rgba(255,253,249,.92);color:var(--danger);display:grid;place-items:center;cursor:pointer;
       box-shadow:0 2px 10px rgba(0,0,0,.2)}
  .del svg{width:18px;height:18px}
  .mine{position:absolute;left:8px;top:8px;background:rgba(184,149,90,.92);color:#fff;font-size:11px;
        font-weight:600;padding:4px 8px;border-radius:8px}
  .empty{text-align:center;color:var(--muted);padding:60px 10px;font-size:15px}

  /* Visor a pantalla completa */
  .viewer{position:fixed;inset:0;background:rgba(20,17,15,.96);z-index:20;display:flex;flex-direction:column}
  .viewer img{flex:1;min-height:0;width:100%;object-fit:contain;padding:12px}
  .viewer .row{padding:0 16px calc(16px + env(safe-area-inset-bottom));margin:0}

  /* Avisos */
  .toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom));transform:translateX(-50%);
         background:var(--ink);color:#fff;padding:12px 18px;border-radius:12px;font-size:14px;z-index:30;
         max-width:90vw;text-align:center;opacity:0;transition:opacity .25s;pointer-events:none}
  .toast.show{opacity:1}
  .spinner{width:20px;height:20px;border:2.5px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .8s linear infinite}
  @keyframes spin{to{transform:rotate(360deg)}}
  .loading{display:flex;justify-content:center;padding:50px}
  .loading .spinner{border-color:var(--line);border-top-color:var(--gold)}
</style>
</head>
<body>

<!-- Portada -->
<section id="home" class="wrap">
  <header>
    <div class="ornament">✦ ✦ ✦</div>
    <h1 id="titulo"></h1>
    <p class="sub" id="subtitulo"></p>
  </header>
  <div class="actions">
    <button class="btn btn-primary" id="btnCamara">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/></svg>
      Hacer una foto
    </button>
    <button class="btn btn-outline" id="btnGaleria">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
      Ver todas las fotos
    </button>
  </div>
  <input type="file" id="inputCamara" accept="image/*" capture="environment" class="hidden">
</section>

<!-- Vista previa: subir o descartar -->
<section id="preview" class="wrap preview hidden">
  <img id="previewImg" alt="Vista previa de la foto">
  <div class="row">
    <button class="btn btn-danger" id="btnDescartar">Descartar</button>
    <button class="btn btn-primary" id="btnSubir">Subir a la nube</button>
  </div>
</section>

<!-- Galería -->
<section id="gallery" class="wrap hidden">
  <div class="bar">
    <button class="btn btn-outline btn-small" id="btnVolver">← Volver</button>
    <h2>Fotos</h2>
    <button class="btn btn-outline btn-small" id="btnRecargar" aria-label="Recargar">↻</button>
  </div>
  <div id="grid" class="grid"></div>
  <div id="galleryState"></div>
</section>

<!-- Visor -->
<div id="viewer" class="viewer hidden">
  <img id="viewerImg" alt="Foto">
  <div class="row">
    <button class="btn btn-outline" id="btnCerrarVisor">Cerrar</button>
    <button class="btn btn-primary" id="btnDescargarVisor">Descargar</button>
  </div>
</div>

<div id="toast" class="toast"></div>

<script>
/* ====== CONFIGURACIÓN — cambia solo esto ====== */
const CONFIG = {
  cloudName:    "ioxxv1uq",          // Cloudinary → Dashboard → Cloud name
  uploadPreset: "boda_unsigned",     // nombre del upload preset (modo Unsigned)
  tag:          "boda",              // etiqueta común de todas las fotos
  titulo:       "Nuestra Boda",
  subtitulo:    "Haz fotos y compártelas con todos"
};
/* ============================================== */

const $ = id => document.getElementById(id);
$("titulo").textContent = CONFIG.titulo;
$("subtitulo").textContent = CONFIG.subtitulo;
document.title = CONFIG.titulo + " · Fotos";

const BASE = `https://res.cloudinary.com/${CONFIG.cloudName}/image`;
const LOCAL_KEY = "boda_mis_subidas";
let pendingBlob = null;
let photos = [];
let viewerPhoto = null;

/* ---------- Navegación ---------- */
function show(id){
  ["home","preview","gallery"].forEach(s => $(s).classList.toggle("hidden", s !== id));
  window.scrollTo(0,0);
}
function toast(msg, ms=2600){
  const t = $("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(t._h); t._h = setTimeout(() => t.classList.remove("show"), ms);
}

/* ---------- Cámara ---------- */
$("btnCamara").onclick = () => $("inputCamara").click();
$("inputCamara").onchange = async e => {
  const file = e.target.files[0];
  e.target.value = "";
  if (!file) return;
  try { pendingBlob = await comprimir(file); } catch { pendingBlob = file; }
  if ($("previewImg").src) URL.revokeObjectURL($("previewImg").src);
  $("previewImg").src = URL.createObjectURL(pendingBlob);
  show("preview");
};

// Reduce a 2560 px de lado mayor (calidad de sobra para imprimir y descargar)
function comprimir(file, max=2560, calidad=0.88){
  return new Promise((resolve, reject) => {
    const img = new Image();
    img.onload = () => {
      const k = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
      const c = document.createElement("canvas");
      c.width = Math.round(img.naturalWidth * k);
      c.height = Math.round(img.naturalHeight * k);
      c.getContext("2d").drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(img.src);
      c.toBlob(b => b ? resolve(b) : reject(), "image/jpeg", calidad);
    };
    img.onerror = reject;
    img.src = URL.createObjectURL(file);
  });
}

$("btnDescartar").onclick = () => { pendingBlob = null; show("home"); };

$("btnSubir").onclick = async () => {
  if (!pendingBlob) return;
  const btn = $("btnSubir");
  btn.disabled = true; btn.innerHTML = '<span class="spinner"></span> Subiendo…';
  try {
    const fd = new FormData();
    fd.append("file", pendingBlob, "foto.jpg");
    fd.append("upload_preset", CONFIG.uploadPreset);
    fd.append("tags", CONFIG.tag);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.cloudName}/image/upload`, { method:"POST", body:fd });
    if (!res.ok) throw new Error(await res.text());
    const r = await res.json();
    guardarLocal({ public_id:r.public_id, version:r.version, format:r.format, created_at:r.created_at,
                   delete_token:r.delete_token, subida:Date.now() });
    pendingBlob = null;
    toast("¡Foto subida! Gracias 💛");
    show("home");
  } catch (err) {
    console.error(err);
    toast("No se pudo subir. Revisa la conexión e inténtalo de nuevo.", 4000);
  } finally {
    btn.disabled = false; btn.textContent = "Subir a la nube";
  }
};

/* Recuerda tus subidas para verlas al instante (la lista de la nube tarda ~1 min en actualizarse) */
function leerLocal(){ try { return JSON.parse(localStorage.getItem(LOCAL_KEY)) || []; } catch { return []; } }
function guardarLocal(p){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify([p, ...leerLocal()].slice(0,200))); } catch {} }
function quitarLocal(id){ try { localStorage.setItem(LOCAL_KEY, JSON.stringify(leerLocal().filter(p => p.public_id !== id))); } catch {} }

/* Fotos borradas: se ocultan aquí al momento, aunque la lista de la nube tarde en enterarse */
const BORRADAS_KEY = "boda_borradas";
function leerBorradas(){ try { return new Set(JSON.parse(localStorage.getItem(BORRADAS_KEY)) || []); } catch { return new Set(); } }
function marcarBorrada(id){ try { const s = leerBorradas(); s.add(id); localStorage.setItem(BORRADAS_KEY, JSON.stringify([...s].slice(-200))); } catch {} }

const VENTANA_BORRADO = 10 * 60 * 1000;  // Cloudinary solo acepta el delete token 10 minutos
const misIds = () => new Map(leerLocal().map(p => [p.public_id, p]));
const puedeBorrar = p => !!(p.delete_token && p.subida && Date.now() - p.subida < VENTANA_BORRADO - 15000);

/* ---------- Galería ---------- */
$("btnGaleria").onclick = () => { show("gallery"); cargarGaleria(); };
$("btnVolver").onclick = () => show("home");
$("btnRecargar").onclick = () => cargarGaleria();

const urlMini  = p => `${BASE}/upload/c_fill,g_auto,w_500,h_500,q_auto,f_auto/v${p.version}/${p.public_id}.${p.format}`;
const urlVisor = p => `${BASE}/upload/c_limit,w_1600,q_auto,f_auto/v${p.version}/${p.public_id}.${p.format}`;
const urlFull  = p => `${BASE}/upload/v${p.version}/${p.public_id}.${p.format}`;
const urlAdj   = p => `${BASE}/upload/fl_attachment/v${p.version}/${p.public_id}.${p.format}`;

async function cargarGaleria(){
  $("grid").innerHTML = "";
  $("galleryState").innerHTML = '<div class="loading"><span class="spinner"></span></div>';
  let remotas = [];
  try {
    const res = await fetch(`${BASE}/list/${CONFIG.tag}.json?t=${Date.now()}`);
    if (res.ok) remotas = (await res.json()).resources || [];
    else if (res.status !== 404) throw new Error(res.status);
  } catch (err) {
    console.error(err);
    toast("No se pudo cargar la galería.", 4000);
  }
  const mapa = new Map();
  [...remotas, ...leerLocal()].forEach(p => mapa.set(p.public_id, p));   // la versión local (con token) manda
  const borradas = leerBorradas();
  photos = [...mapa.values()]
    .filter(p => !borradas.has(p.public_id))
    .sort((a,b) => new Date(b.created_at) - new Date(a.created_at));
  pintar();
}

const ICON_DL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M5 21h14"/></svg>';

function pintar(){
  $("galleryState").innerHTML = photos.length ? "" : '<div class="empty">Todavía no hay fotos.<br>¡Sé el primero en subir una!</div>';
  const grid = $("grid");
  const mias = misIds();
  grid.innerHTML = "";
  photos.forEach(p => {
    const tile = document.createElement("div");
    tile.className = "tile";
    const img = document.createElement("img");
    img.loading = "lazy"; img.alt = "Foto de la boda"; img.src = urlMini(p);
    img.onclick = () => abrirVisor(p);
    const b = document.createElement("button");
    b.className = "dl"; b.innerHTML = ICON_DL; b.setAttribute("aria-label","Descargar");
    b.onclick = () => descargar(p);
    tile.append(img, b);
    const mia = mias.get(p.public_id);
    if (mia) {
      const tag = document.createElement("span");
      tag.className = "mine"; tag.textContent = "Tuya";
      tile.append(tag);
      if (puedeBorrar(mia)) {
        const d = document.createElement("button");
        d.className = "del"; d.innerHTML = ICON_DEL; d.setAttribute("aria-label","Borrar");
        d.onclick = () => borrar(mia);
        tile.append(d);
      }
    }
    grid.append(tile);
  });
}

const ICON_DEL = '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M19 6l-1 14H6L5 6"/></svg>';

async function borrar(p){
  if (!puedeBorrar(p)) { toast("Ya no se puede borrar: han pasado más de 10 minutos.", 3500); pintar(); return; }
  if (!confirm("¿Borrar esta foto de la galería?")) return;
  try {
    const fd = new FormData();
    fd.append("token", p.delete_token);
    const res = await fetch(`https://api.cloudinary.com/v1_1/${CONFIG.cloudName}/delete_by_token`, { method:"POST", body:fd });
    if (!res.ok) throw new Error(await res.text());
    marcarBorrada(p.public_id);
    quitarLocal(p.public_id);
    photos = photos.filter(x => x.public_id !== p.public_id);
    pintar();
    toast("Foto borrada");
  } catch (err) {
    console.error(err);
    toast("No se pudo borrar la foto.", 3500);
  }
}

// Oculta el botón de borrar cuando caduca el plazo
setInterval(() => {
  if ($("gallery").classList.contains("hidden") || !document.querySelector(".del")) return;
  const mias = misIds();
  if (photos.some(p => mias.has(p.public_id) && !puedeBorrar(mias.get(p.public_id))) && document.querySelectorAll(".del").length) pintar();
}, 30000);

/* ---------- Visor ---------- */
function abrirVisor(p){ viewerPhoto = p; $("viewerImg").src = urlVisor(p); $("viewer").classList.remove("hidden"); }
$("btnCerrarVisor").onclick = () => { $("viewer").classList.add("hidden"); $("viewerImg").src = ""; };
$("btnDescargarVisor").onclick = () => viewerPhoto && descargar(viewerPhoto);

/* ---------- Descarga ---------- */
const esIOS = /iPhone|iPad|iPod/.test(navigator.userAgent) ||
              (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);

async function descargar(p){
  const nombre = `boda-${p.public_id.split("/").pop()}.${p.format}`;
  toast("Preparando la foto…", 1500);
  try {
    const res = await fetch(urlFull(p));
    if (!res.ok) throw new Error(res.status);
    const blob = await res.blob();
    const file = new File([blob], nombre, { type: blob.type || "image/jpeg" });
    // iPhone/iPad: la hoja de compartir permite "Guardar imagen" directamente en Fotos
    if (esIOS && navigator.canShare && navigator.canShare({ files:[file] })) {
      await navigator.share({ files:[file] });
      return;
    }
    // Android y ordenador: descarga directa (aparece en la galería / Descargas)
    const a = document.createElement("a");
    a.href = URL.createObjectURL(blob); a.download = nombre;
    document.body.append(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 4000);
  } catch (err) {
    if (err && err.name === "AbortError") return;   // canceló la hoja de compartir
    window.location.href = urlAdj(p);                // plan B: descarga servida por Cloudinary
  }
}
</script>
</body>
</html>
